<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>U4U Acoustic Vault</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #050a08;
            --terminal-green: #00ffcc;
            --alert-red: #ff3366;
            --text-muted: #4a7c68;
            --input-bg: rgba(0, 255, 204, 0.05);
        }
        body {
            background-color: var(--bg-color);
            color: var(--terminal-green);
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--terminal-green);
            padding-bottom: 10px;
            width: 100%;
            max-width: 400px;
        }
        .lore-box {
            background: var(--input-bg);
            border: 1px solid var(--text-muted);
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9em;
            line-height: 1.4;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.1);
        }
        .lore-title {
            color: #fff;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .mesh-btn {
            background-color: transparent;
            color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            padding: 12px;
            font-size: 1em;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .mesh-btn:active, .mesh-btn:hover {
            background-color: var(--terminal-green);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--terminal-green);
        }
        .mesh-btn.alert {
            color: var(--alert-red);
            border-color: var(--alert-red);
        }
        .mesh-btn.alert:active, .mesh-btn.alert:hover {
            background-color: var(--alert-red);
            color: #fff;
            box-shadow: 0 0 15px var(--alert-red);
        }
        textarea {
            width: 100%;
            background: transparent;
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 10px;
            font-family: inherit;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 10px;
            min-height: 60px;
        }
        textarea::placeholder {
            color: var(--text-muted);
        }
        .split-buttons {
            display: flex;
            gap: 10px;
        }
        .split-buttons .mesh-btn {
            flex: 1;
            font-size: 0.85em;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>U4U MESH // V33.19</h2>
        <div style="font-size: 0.8em; color: var(--text-muted);">ROOT & RELAY PROTOCOL ACTIVE</div>
    </div>

    <div class="lore-box">
        <div class="lore-title">Acoustic Vault Log</div>
        <div>
            "The Peace Nodes hummed with a resonant frequency that Elara recognized immediately. It wasn't just data transfer; it was a suspended state. The network was breathing."
        </div>
    </div>

    <!-- N+M Swarm Ingestion Module -->
    <div class="lore-box">
        <div class="lore-title">N+M Swarm Ingestion</div>
        <textarea id="leadInput" placeholder="Paste RFP, grant, or job lead details here to initiate hybrid intelligence synthesis..."></textarea>
        <div class="split-buttons">
            <button class="mesh-btn" onclick="submitLead('/job_lead')">Synthesize B2B Proposal</button>
            <button class="mesh-btn" onclick="submitLead('/grant_lead')">Draft Grant Narrative</button>
        </div>
    </div>

    <div class="button-container">
        <button class="mesh-btn" onclick="triggerCommand('/swarm')">🐝 INITIATE N+M SWARM</button>
        <button class="mesh-btn" onclick="triggerCommand('/apex')">🔐 ACCESS APEX GATE</button>
        <button class="mesh-btn alert" onclick="triggerCommand('/xenon_spin')">🛑 XENON ANESTHETIC OVERRIDE</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function triggerCommand(cmd) {
            tg.HapticFeedback.impactOccurred('heavy');
            tg.sendData(cmd); 
        }

        function submitLead(commandType) {
            const input = document.getElementById('leadInput').value;
            if (!input) {
                tg.showAlert("Input required. The Swarm cannot synthesize an empty payload.");
                return;
            }
            tg.HapticFeedback.impactOccurred('heavy');
            tg.sendData(commandType + " " + input);
        }
    </script>
</body>
</html>
